[package]
name = "claude-visualizer"
version = "0.1.0"
description = "Real-time instrument cluster for Claude Code sessions"
authors = ["Jamison Hill"]
edition = "2021"

[lib]
# The `_lib` suffix keeps the library name distinct from the binary name,
# which avoids a cargo name-collision issue (mostly on Windows).
name = "claude_visualizer_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
# Remembers the window's size and position between launches (SPEC §6).
tauri-plugin-window-state = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Filesystem watcher for ~/.claude/sessions (SPEC §3 — SessionRegistryWatcher).
notify = "8"
# For kill(pid, 0) liveness probes and gethostname.
libc = "0.2"
# Parses the ISO 8601 timestamps on transcript lines (rate windows need them);
# local-offset gives us the machine's timezone for the odometers' midnight reset.
time = { version = "0.3", features = ["parsing", "local-offset"] }
